server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the browser asks of the backend goes through the Node service, the same way the
    # Vite dev proxy does it locally. One origin, so no CORS.
    location /api {
        proxy_pass http://mleuv-api:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generating the guideline text waits up to 15 minutes for the Python service
        # (AbortSignal.timeout(900_000) in apps/api/src/server.ts). nginx's default of 60 s would
        # answer 504 long before that.
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;

        # Uploaded drafts for the review mode (/api/pruefen). nginx's default is 1 MB; the Node
        # service itself takes up to 20 MB there (bodyLimit in server.ts).
        client_max_body_size 21m;
    }
}
