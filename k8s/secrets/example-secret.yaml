# The credentials of the hosted instance. Copy this file to secret.yaml, fill in the real value
# and seal it:
#
#   cp example-secret.yaml secret.yaml
#   ./seal.sh
#
# secret.yaml is gitignored, never commit it. The cluster only reads sealed-secret.yaml, which is
# the same secret encrypted with the cluster's public key and safe to commit. A change here means
# nothing until it is sealed again.
apiVersion: v1
kind: Secret
metadata:
  name: mleuv-secret
  namespace: mleuv
type: Opaque
stringData:
  # The key for the AISC AI Hub (LiteLLM, api.aisc.hpi.de). Best a key of its own for the hosted
  # instance, with a budget: everybody who uses it spends from it.
  AI_HUB_API_KEY: "YOUR_AI_HUB_KEY_HERE"
