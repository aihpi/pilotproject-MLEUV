apiVersion: apps/v1
kind: Deployment
metadata:
  name: mleuv-api
  labels:
    app: mleuv-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # One replica on purpose: the drafts are one file that the service reads into memory and
  # writes back. A second replica would overwrite the first one's changes.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mleuv-api
  template:
    metadata:
      labels:
        app: mleuv-api
    spec:
      containers:
        - name: api
          image: ghcr.io/aihpi/pilotproject-mleuv/api:sha-762dc65
          ports:
            - containerPort: 4317
          env:
            - name: PORT
              value: "4317"
            - name: VORSCHLAG_URL
              value: http://mleuv-backend:8000
          volumeMounts:
            - name: entwuerfe
              mountPath: /app/apps/api/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4317
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4317
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: entwuerfe
          persistentVolumeClaim:
            claimName: mleuv-entwuerfe
