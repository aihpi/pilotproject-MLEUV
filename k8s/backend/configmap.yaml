apiVersion: v1
kind: ConfigMap
metadata:
  name: mleuv-backend-config
data:
  # The same settings as 02_backend/.env.example, for the cluster. The key is in the secret
  # (LITELLM_API_KEY, see deployment.yaml).
  LITELLM_BASE_URL: "https://api.aisc.hpi.de/"
  # LiteLLM otherwise fetches its model price list from GitHub on every start.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

  LLM_MODEL: "openai/gpt-oss-120b"
  EMBEDDING_MODEL: "openai/octen-embedding-8b"
  JUDGE_MODEL: "llama-3-3-70b"
  LLM_FALLBACKS: "gemma-4-31b,llama-3-3-70b,ministral-3-14b"
  JUDGE_FALLBACKS: "gemma-4-31b,ministral-3-14b,gpt-oss-120b"

  QDRANT_URL: "http://mleuv-qdrant:6333"
  COLLECTION: "mleuv_durchstich"

  # Relative to 02_backend, where the image links data/ to the volume at /data. So the corpus
  # goes to /data/Daten des MLEUV on the volume, the same layout as locally.
  CORPUS_DIR: "data/Daten des MLEUV"
  # 09 belongs here: the existing state guidelines, the models "how is this done elsewhere"
  # draws on. See the note in .env.example.
  CORPUS_PREFIXES: "01,03,04,08,09,10,11"
  MAX_DOCS: "200"

  # The code defaults to true, which drops the whole index at the start of every ingest run.
  # Set explicitly here so a run in the pod never does that by accident. For a fresh index:
  #   kubectl exec -n mleuv deploy/mleuv-backend -- env RECREATE=true python src/ingest.py
  RECREATE: "false"
  NUR_AKTUELL: "true"
  TOP_K: "5"
