# Die Prüfregeln des Prozessmodells — welche umgesetzt sind und welche nicht.
#
# ERZEUGT aus `regeln_roh_lokal.yaml` (nicht im Repo, Wortlaut aus dem vertraulichen
# Prozessmodell) mit einer Zuordnung von Hand. Hier steht KEIN Wortlaut aus dem Modell,
# sondern die destillierte Regel: Rechtsstelle, Schwellenwert, Zielfeld und die Kennung der
# Prüfung, die sie umsetzt. Rechtsstellen sind öffentliches Recht.
#
# `id` ist die laufende Nummer im Rohauszug — darüber ist jeder Eintrag auf das
# Modellelement zurückzuführen, ohne dass dessen Bezeichnung hier stehen muss.
#
# status:
#   umgesetzt       eine Prüfung in packages/shared trägt sie, `umgesetzt_als` nennt sie
#   teilweise       die Prüfung greift, deckt aber nicht den ganzen Regelgehalt
#   offen           keine Prüfung vorhanden
#   zurueckgestellt bewusst nicht gebaut, `grund` sagt warum
#   kein_pruefpunkt ein Prozess- oder Texteintragungsschritt, nichts zu prüfen
#
# Zweck: Das Prozessmodell ist die maßgebliche Quelle der Fachlogik. Ohne diese Übersicht
# weiß niemand, welche seiner Regeln das Werkzeug kennt — die Prüfungen standen bis zum
# 09.10.2026 nur im Code, ohne Rückbezug auf das Modell.

