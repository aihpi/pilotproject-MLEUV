services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./.data/qdrant:/qdrant/storage

  # docling-serve läuft mit für den späteren Spark-kompatiblen Weg.
  # Der Durchstich (ingest.py) nutzt zunächst die docling-Bibliothek direkt.
  docling-serve:
    image: quay.io/docling-project/docling-serve:latest
    ports:
      - "5001:5001"
