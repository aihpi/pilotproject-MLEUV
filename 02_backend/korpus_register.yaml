# Dokumentregister — Baustein (a) der Adressierung.
#
# Wozu: Im Text steht "ANBest-P", im Index steht
# "ANBest-P_Anlage 15 zu VV Nr. 5.1 zu § 44 LHO.242860.pdf". Ohne diese Brücke findet
# kein Verweis sein Ziel. Das Register ist zugleich die Liste zulässiger Abkürzungen,
# die `norm_extraction.yaml` aus norm-matching als `lawbooks` erwartet.
#
# Felder je Eintrag:
#   datei       Dateiname wie im Qdrant-Payload unter `quelle`
#   kurzname    Name, unter dem das Dokument im Fließtext zitiert wird
#   aliase      weitere Schreibweisen, unter denen es zitiert wird (für die Verweisauflösung)
#   art         gesetz | verordnung_eu | verwaltungsvorschrift | nebenbestimmungen |
#               richtlinie | rahmenplan | leitlinie | muster | merkblatt
#   zitierweise nummer (Gliederungsnummern) | artikel (EU-Verordnungen)
#   pruefen     true = vom MLEUV zu bestätigen; Kurzname geraten oder Zitierweise unklar
#
# ?? = Zweifelsfall, bitte gegenlesen. Bei den Landesrichtlinien gibt es meist keine
# eingeführte Kurzform; dort ist der Kurzname eine Setzung, damit Verweise überhaupt
# eine Zieladresse haben.

dokumente:

