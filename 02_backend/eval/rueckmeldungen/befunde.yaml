- id: BF-01
  titel: Punkt nach Ordnungszahl oder Abkürzung beendet den Satz
  platz: A
  issue: "#6"
  rueckmeldungen: [R-008, R-012, R-018, R-022]
  programmstand: {R-008: 9e4b89f, R-012: 9e4b89f, R-018: bf3032e, R-022: bf3032e}
  stand: besteht noch
  protokoll: [2026-10-19T10:55, 2026-11-12T12:59]
  art: Fehler
  schicht: Prüfregeln
  pruefbarkeit: fest
  schwere: 3
  belege: {rueckmeldungen: 4, entwuerfe: 2}
  ursache: >-
    bestätigt — richtlinie.py, SATZENDE. Das Lookbehind (?<![0-9]) steht an der Trennstelle
    hinter dem Punkt und sieht den Punkt, nie die Ziffer davor. Abkürzungen (Art., Abs.)
    kennt die Regel nicht. pruefe_fragmente meldet das Reststück („Dezember 2029.“,
    „1 Abs.“) als Zwischenüberschrift.
  erwartung: >-
    Kein Fragmentbefund für ein Datum wie „31. Dezember 2029“ und für Normverweise wie
    „Art. 1 Abs. 1 Verordnung (EU) …“.
  erwartung_herkunft: Testerin
  gegenprobe: Eine echte Zwischenüberschrift mit Punkt (zwei Wörter) wird weiter gemeldet.

