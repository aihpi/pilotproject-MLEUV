# Feld-Eval: landet der richtige Wert im richtigen Feld?
#
# Der Fragenkatalog in validation.jsonl misst das Retrieval — findet die Suche die richtige
# Stelle im Korpus. Diese Sammlung misst die Schicht darüber, und die kann falsch sein,
# während das Retrieval tadellos arbeitet: beim ersten Probelauf stand im Zuwendungszweck
# eine Maßnahmenliste aus einer FREMDEN Richtlinie, sauber belegt, mit Konfidenz 0,99.
#
# Prüfbare Eigenschaften je Feld (alle optional, alle kombinierbar):
#   wert           exakter Wert nach Normalisierung — für Auswahlfelder
#   unklar         true: es MUSS [Unklar] herauskommen
#   enthaelt       Liste: alle Zeichenfolgen müssen vorkommen (Groß-/Kleinschreibung egal)
#   nicht          Liste: keine davon darf vorkommen
#   eigenstaendig  true: der Wert darf NICHT wörtlich aus einer Fundstelle stammen
#   min_konfidenz  untere Schranke
#   max_konfidenz  obere Schranke
#   gedeckt        true: die Deckung in der Eingabe muss nachgewiesen sein
#
# Freitext wird bewusst über Eigenschaften geprüft, nicht über den Wortlaut: „Verbesserung
# des Tierschutzes" und „Tierschutz verbessern" sind beide richtig. Wer den Wortlaut
# festschreibt, misst das Modell und nicht die Sache.

felder:
  goal:
    id: goal
    label: Förderziel
    kind: textarea
  purpose:
    id: purpose
    label: Zuwendungszweck
    kind: textarea
  legalBasis:
    id: legalBasis
    label: Rechtsgrundlage
    kind: radio
    options:
      - {value: lho44, label: Zuwendung nach § 44 LHO}
      - {value: lho53, label: Billigkeitsleistung nach § 53 LHO}
      - {value: administrative, label: Verwaltungsvorschriften}

  # --- Baustein 3, Zuwendungsempfänger ---
  # Das Auswahlfeld, an dem der kommunale Höchstsatz hängt. Es blieb im Durchlauf vom
  # 22.09.2026 dreimal leer, obwohl die Gruppen wörtlich genannt waren.
  recipients:
    id: recipients
    label: Zuwendungsempfänger
    kind: checkbox
    options:
      - {value: natural, label: Natürliche Personen}
      - {value: private, label: Juristische Personen des privaten Rechts}
      - {value: public, label: Juristische Personen des öffentlichen Rechts}
      - {value: municipal, label: Kommunen und kommunale Einrichtungen}
      - {value: sme, label: Kleine und mittlere Unternehmen}
      - {value: research, label: Hochschulen und Forschungseinrichtungen}
      - {value: other, label: Weitere Gruppen}
  recipientDetails:
    id: recipientDetails
    label: Konkretisierung der Zielgruppe
    kind: textarea

  # --- Baustein 2 ---
  subject:
    id: subject
    label: Gegenstand der Förderung
    kind: textarea

  # --- Baustein 5, Art, Umfang und Höhe ---
  # Die Felder, die bis zum 22.09.2026 nie erhoben wurden, weil die Chat-Stufe nur zwei
  # ihrer elf Felder an den Dienst weitergab. An dreien davon hängen Prüfregeln.
  financingType:
    id: financingType
    label: Finanzierungsart
    kind: radio
    options:
      - {value: share, label: Anteilfinanzierung}
      - {value: deficit, label: Fehlbedarfsfinanzierung}
      - {value: fixed, label: Festbetragsfinanzierung}
      - {value: full, label: Vollfinanzierung}
  financingForm:
    id: financingForm
    label: Finanzierungsform
    kind: radio
    options:
      - {value: allocation, label: Zuweisung}
      - {value: grant, label: Zuschuss}
  eligibleBasis:
    id: eligibleBasis
    label: Bemessungsgrundlage
    kind: radio
    options:
      - {value: actual, label: Spitzabrechnung}
      - {value: overhead, label: Spitzabrechnung mit Gemeinkosten}
      - {value: fixed-rates, label: Feste Beträge}
      - {value: fixed-rest, label: Feste Beträge mit Pauschalfinanzierung der Restkosten}
  eligibleCosts:
    id: eligibleCosts
    label: Zuwendungsfähige Ausgaben oder Kosten
    kind: textarea
  fundingRate:
    id: fundingRate
    label: Fördersatz in Prozent
    kind: number
  fixedAmount:
    id: fixedAmount
    label: Festbetrag in Euro
    kind: number
  minimum:
    id: minimum
    label: Bagatellgrenze in Euro
    kind: number

  # --- Baustein 6, Sonstige Zuwendungsbestimmungen ---
  # Der erste Abschnitt, in dem überwiegend der Regelfall gilt — und der erste, der über den
  # Formular-Knopf statt über den Chat gefüllt wird.
  ancillary:
    id: ancillary
    label: Allgemeine Nebenbestimmungen
    kind: radio
    # Wortgleich mit dem `help` in packages/shared — der Hinweis geht dort in den Prompt, und
    # ein Fall ohne ihn prüft etwas anderes als den Betrieb. Bleibt beides nicht beieinander,
    # misst der Eval eine Oberfläche, die es so nicht gibt.
    help: >-
      ANBest-P gilt für Zuwendungen zur Projektförderung allgemein, ANBest-G für Gemeinden
      und Gemeindeverbände. Umfasst der Empfängerkreis BEIDE Gruppen, gelten auch beide —
      jede für ihre Gruppe.
    options:
      - {value: anbest-p, label: ANBest-P}
      - {value: anbest-g, label: ANBest-G}
      - {value: anbest-p-g, label: ANBest-P und ANBest-G}
  auditRights:
    id: auditRights
    label: Prüfberechtigte Stellen
    kind: checkbox
    options:
      - {value: lrh, label: Landesrechnungshof Brandenburg}
      - {value: ministry, label: Zuständiges Ministerium}
      - {value: brh, label: Bundesrechnungshof}
      - {value: bwb, label: Bundesbeauftragte für Wirtschaftlichkeit in der Verwaltung}
  purposeBindingYears:
    id: purposeBindingYears
    label: Zweckbindungsfrist in Jahren
    kind: number
  otherConditions:
    id: otherConditions
    label: Weitere fachliche Nebenbestimmungen
    kind: textarea

  # --- Baustein 4, Zuwendungsvoraussetzungen ---
  requirements:
    id: requirements
    label: Zuwendungsvoraussetzungen
    kind: textarea
  area:
    id: area
    label: Gebietskulisse
    kind: textarea
  selectionCriteria:
    id: selectionCriteria
    label: Auswahl- und Wertungskriterien
    kind: textarea
  aidRegime:
    id: aidRegime
    label: Beihilferechtliche Einordnung
    kind: checkbox
    options:
      - {value: de-minimis, label: De-minimis}
      - {value: agvo, label: AGVO}
      - {value: agrar-gvo, label: AgrarGVO}
      - {value: notification, label: Notifizierung}

  # --- Baustein 7, Verfahren ---
  authority:
    id: authority
    label: Bewilligungsbehörde
    kind: text
  selection:
    id: selection
    label: Antragsauswahl
    kind: radio
    options:
      - {value: first, label: Windhundprinzip}
      - {value: criteria, label: Kriteriengebundene Auswahl}
  applicationProcedure:
    id: applicationProcedure
    label: Antragsverfahren
    kind: radio
    options:
      - {value: analog, label: Schriftlich, ohne Frist}
      - {value: analog-deadline, label: Schriftlich, mit Antragsfrist}
      - {value: digital, label: Digitales Antragssystem, ohne Frist}
      - {value: digital-deadline, label: Digitales Antragssystem, mit Antragsfrist}
  payment:
    id: payment
    label: Anforderungs- und Auszahlungsverfahren
    kind: radio
    options:
      - {value: advance, label: Vorschussprinzip}
      - {value: refund, label: Erstattungsprinzip}
  applicationDeadline:
    id: applicationDeadline
    label: Antragsfrist
    kind: date
  applicationType:
    id: applicationType
    label: Verfahrensart
    kind: radio
    options:
      - {value: one, label: Einstufig}
      - {value: two, label: "Zweistufig (Antrag, Verwendungsnachweis inklusive Auszahlung)"}
      - {value: three, label: "Dreistufig (Antrag, Auszahlung, Verwendungsnachweis)"}

  # --- Baustein 8, Geltungsdauer ---
  validFrom:
    id: validFrom
    label: Inkrafttreten
    kind: date
  validUntil:
    id: validUntil
    label: Außerkrafttreten
    kind: date

faelle:

  - id: F-01-vollstaendig
    notiz: >-
      Der Regelfall: die Angabe nennt Ziel, Gegenstand und Finanzierungsquelle.
      Alle drei Felder müssen gefüllt werden, nichts darf [Unklar] sein.
    abschnitt_nr: 1
    eingabe: >-
      Wir wollen Tierheime im Land Brandenburg fördern, damit der Tierschutz verbessert
      wird. Reine Landesmittel, Zuwendung als Zuschuss.
    felder: [goal, purpose, legalBasis]
    erwartet:
      goal: {enthaelt: [tierschutz], gedeckt: true}
      purpose: {enthaelt: [tierheim], eigenstaendig: true}
      legalBasis: {wert: lho44}

  - id: F-02-abschreibfalle
    notiz: >-
      Dieselbe Sache, aber mit Begriffen, die stark auf die vorhandene
      Tierheimförderungs-Richtlinie zeigen. Genau hier hat das Modell zweimal aus der
      fremden Richtlinie abgeschrieben. Der Wert muss eigenständig formuliert sein.
    abschnitt_nr: 1
    eingabe: >-
      Zuwendungszweck: Unterbringung und Pflege von Fundtieren in gemeinnützigen
      Tierheimen. Landesmittel.
    felder: [purpose, legalBasis]
    erwartet:
      purpose: {eigenstaendig: true, nicht: ["zielt darauf ab"]}
      legalBasis: {wert: lho44}

  - id: F-03-duenn
    notiz: >-
      Nichts Verwertbares. Es MUSS [Unklar] kommen statt einer Erfindung — die Regel
      „keine Negativaussage ohne geschlossene Bezugsgröße" gilt auch hier.
    abschnitt_nr: 1
    eingabe: Wir hätten gern eine Richtlinie für Tierheime.
    felder: [goal, purpose, legalBasis]
    erwartet:
      goal: {unklar: true}
      purpose: {unklar: true}
      legalBasis: {unklar: true, max_konfidenz: 0.5}

  - id: F-04-billigkeit
    notiz: >-
      Nicht der Regelfall: § 53 LHO statt § 44. Prüft, ob die Auswahl der Angabe folgt
      und nicht dem Muster.
    abschnitt_nr: 1
    eingabe: >-
      Es geht um eine Billigkeitsleistung nach § 53 LHO für Betriebe, die von der
      Dürre betroffen sind. Landesmittel.
    felder: [legalBasis]
    erwartet:
      legalBasis: {wert: lho53, min_konfidenz: 0.6, gedeckt: true}

  - id: F-05-verwaltungsvorschrift
    notiz: >-
      Förderung nachgeordneter Behörden läuft über eine Verwaltungsvorschrift, nicht über
      § 44 LHO. Der Musterbaustein 1.1 weist ausdrücklich darauf hin.
    abschnitt_nr: 1
    eingabe: >-
      Wir wollen eine Verwaltungsvorschrift für die Förderung einer nachgeordneten
      Landesbehörde erlassen. Es handelt sich nicht um Zuwendungen.
    felder: [legalBasis]
    erwartet:
      legalBasis: {wert: administrative, gedeckt: true}

  - id: F-06-kein-ziel-genannt
    notiz: >-
      Der Gegenstand steht da, das Förderziel nicht. Teilweise Deckung: purpose muss
      kommen, goal darf nicht erfunden werden.
    abschnitt_nr: 1
    eingabe: >-
      Gefördert werden sollen Investitionen in Bewässerungstechnik im Obstbau.
      Finanzierung aus Landesmitteln.
    felder: [goal, purpose, legalBasis]
    erwartet:
      purpose: {enthaelt: [bewässerung], eigenstaendig: true}
      legalBasis: {wert: lho44}

  # ---------------------------------------------------------------------------
  # Aus den Durchläufen über die Oberfläche am 18. und 22.09.2026.
  #
  # Jeder Fall hier stand vorher eine Stunde lang in einem Browserfenster. Sie sind der
  # Grund, warum diese Sammlung überhaupt über Baustein 1 hinauswächst: der Fehler, der den
  # ganzen Tag gekostet hat — Fördersatz und Finanzierungsart kamen nie in den Feldern an —
  # wäre von keinem der sechs Fälle darüber gemeldet worden.
  # ---------------------------------------------------------------------------

  - id: F-07-baustein5-vollstaendig
    notiz: >-
      Der Fall, an dem alles hing. Eine Angabe nennt Kosten, Bemessungsgrundlage,
      Fördersatz, Finanzierungsart und Finanzierungsform auf einmal — alle fünf müssen
      ankommen. Kommt der Fördersatz nicht als ZAHL, rechnet die Prüfregel zum kommunalen
      Höchstsatz an ihm vorbei, ohne zu meckern.
    abschnitt_nr: 5
    eingabe: >-
      Förderfähig sind die Tierarztkosten und die Kosten für Mikrochips, abgerechnet wird
      spitz nach tatsächlichen Kosten. Der Fördersatz beträgt 90 Prozent, als
      Anteilfinanzierung in Form eines Zuschusses.
    felder: [eligibleCosts, eligibleBasis, fundingRate, financingType, financingForm]
    erwartet:
      eligibleCosts: {enthaelt: [mikrochip], gedeckt: true}
      eligibleBasis: {wert: actual}
      fundingRate: {wert: 90, gedeckt: true}
      financingType: {wert: share}
      financingForm: {wert: grant}

  - id: F-08-mehrfachauswahl
    notiz: >-
      Der Empfängerkreis, an dem der kommunale Höchstsatz hängt. Blieb dreimal in Folge
      leer: das Feld war dem Modell als Einfachauswahl beschrieben, es sah nur die
      Kennungen statt der Beschriftungen, und die Liste kam als JSON-ZEICHENKETTE zurück.
      Beide Gruppen müssen ankommen, nicht nur die erste.
    abschnitt_nr: 3
    eingabe: >-
      Zuwendungsempfänger sind Kommunen und kommunale Einrichtungen sowie juristische
      Personen des privaten Rechts, insbesondere amtlich anerkannte Tierschutzvereine.
    felder: [recipients, recipientDetails]
    erwartet:
      recipients: {enthaelt: [municipal, private], gedeckt: true}
      recipientDetails: {enthaelt: [tierschutzverein]}

  - id: F-09-festbetrag
    notiz: >-
      Der Festbetragszweig, bisher nie geprüft. Ausgerechnet sein Musterbaustein stand im
      Katzentext, obwohl Anteilfinanzierung gewählt war. Hier ist er richtig — und der
      Betrag muss als Zahl im eigenen Feld landen, nicht im Fließtext.
    abschnitt_nr: 5
    eingabe: >-
      Gefördert wird mit einem Festbetrag je Mitglied und Jahr in Höhe von 12 Euro, als
      Festbetragsfinanzierung in Form eines Zuschusses.
    felder: [financingType, financingForm, fixedAmount, fundingRate]
    erwartet:
      financingType: {wert: fixed}
      financingForm: {wert: grant}
      fixedAmount: {wert: 12, gedeckt: true}
      fundingRate: {unklar: true}

  - id: F-10-bagatellgrenze
    notiz: >-
      Unterhalb der Regelgrenze von 2.500 Euro. Der Wert muss als Zahl ankommen, damit die
      Prüfregel einen begründungspflichtigen Vermerkseintrag erzeugen kann. Kommt „1.000
      Euro" als Text, schlägt sie nicht an — und ein ruhiger Bildschirm sähe aus wie ein
      fehlerfreier Entwurf.
    abschnitt_nr: 5
    eingabe: Die Bagatellgrenze liegt bei 1.000 Euro.
    felder: [minimum]
    erwartet:
      minimum: {wert: 1000, gedeckt: true}

  - id: F-11-keine-kommunen
    notiz: >-
      Die Gegenprobe zu F-08: Empfänger ohne Kommunen. Der kommunale Höchstsatz DARF dann
      nicht anschlagen. Eine Regel, die immer auslöst, ist so unbrauchbar wie eine, die nie
      auslöst — geprüft wird hier die Eingangsgröße dafür.
    abschnitt_nr: 3
    eingabe: >-
      Zuwendungsempfänger sind juristische Personen des privaten Rechts, nämlich nach dem
      Bundeswaldgesetz anerkannte forstwirtschaftliche Zusammenschlüsse.
    felder: [recipients, recipientDetails]
    erwartet:
      recipients: {enthaelt: [private], nicht: [municipal], gedeckt: true}
      recipientDetails: {enthaelt: [zusammenschl]}

  - id: F-12-lange-eingabe
    notiz: >-
      Eine Angabe, die fünf Bausteine auf einmal deckt. Unter dieser Last kopierte das
      Modell denselben Rohsatz in Förderziel UND Zuwendungszweck, beide mit Konfidenz 0,99.
      Die beiden müssen verschieden sein: das Ziel ist der Zustand, der Zweck das, was
      gefördert wird.
    abschnitt_nr: 1
    eingabe: >-
      Wir wollen erreichen, dass es weniger freilebende Katzen im Land Brandenburg gibt und
      diese Tiere nicht länger unter Krankheiten und Unterernährung leiden. Gefördert werden
      das Einfangen und die Kastration freilebender Katzen durch Tierärztinnen und
      Tierärzte, die Kennzeichnung mit einem Mikrochip und die Registrierung in einem
      Haustierregister. Zuwendungsempfänger sind Kommunen und kommunale Einrichtungen sowie
      juristische Personen des privaten Rechts. Förderfähig sind die Tierarztkosten und die
      Kosten für Mikrochips, abgerechnet wird spitz nach tatsächlichen Kosten. Der
      Fördersatz beträgt 90 Prozent, als Anteilfinanzierung in Form eines Zuschusses.
    felder: [goal, purpose, legalBasis]
    erwartet:
      goal: {enthaelt: [katzen], gedeckt: true}
      purpose: {enthaelt: [kastration], gedeckt: true}
      legalBasis: {wert: lho44}

  - id: F-13-forst-gegenstand
    notiz: >-
      Zweiter Sachbereich neben dem Tierschutz, und die Richtlinie dazu liegt im Holdout.
      Prüft, ob der Gegenstand eigenständig formuliert wird, wenn die naheliegende Vorlage
      NICHT im Index steht.
    abschnitt_nr: 2
    eingabe: >-
      Gefördert werden die Gründung und die laufende Geschäftsführung anerkannter
      forstwirtschaftlicher Zusammenschlüsse sowie Fortbildungen für ihre Mitglieder.
    felder: [subject]
    erwartet:
      subject: {enthaelt: [zusammenschl], eigenstaendig: true, gedeckt: true}

  - id: F-14-pruefrechte-land
    notiz: >-
      Reine Landesförderung. Prüfberechtigt sind der Landesrechnungshof und das zuständige
      Ministerium — der Bundesrechnungshof NICHT, denn er prüft, wo Bundesmittel fließen.
      Im Durchlauf vom 23.09.2026 kam er trotzdem mit.
    abschnitt_nr: 6
    eingabe: >-
      Die Förderung erfolgt aus reinen Landesmitteln. Es gelten die üblichen
      Nebenbestimmungen.
    felder: [ancillary, auditRights]
    erwartet:
      auditRights: {enthaelt: [lrh, ministry], nicht: [brh, bwb]}

  - id: F-15-nebenbestimmungen-kommunal
    notiz: >-
      Kommunen und Private zugleich: dann sind beide Nebenbestimmungen einschlägig,
      ANBest-P und ANBest-G. Prüft, ob das Modell den gemischten Fall erkennt, statt eine
      der beiden zu wählen.
    abschnitt_nr: 6
    eingabe: >-
      Zuwendungsempfänger sind Kommunen und kommunale Einrichtungen sowie juristische
      Personen des privaten Rechts.
    felder: [ancillary]
    erwartet:
      ancillary: {wert: anbest-p-g}

  - id: F-16-keine-zweckbindung-genannt
    notiz: >-
      Zur Zweckbindungsfrist sagt die Eingabe nichts, und die Musterrichtlinie nennt keinen
      festen Wert. Es MUSS [Unklar] kommen — eine geratene Jahreszahl in einer Richtlinie
      bindet Zuwendungsempfänger über Jahre.
    abschnitt_nr: 6
    eingabe: Gefördert wird die Kastration freilebender Katzen aus Landesmitteln.
    felder: [purposeBindingYears]
    erwartet:
      purposeBindingYears: {unklar: true}

  - id: F-17-freitext-wiederholt-nachbarn-nicht
    notiz: >-
      Der Fehler, den der Formular-Knopf zutage gefördert hat: „Weitere fachliche
      Nebenbestimmungen" schrieb die Prüfungsberechtigten, die Inventarisierungsgrenze und
      die Geschlechtergleichstellung als Fließtext hin — für alle drei gibt es im selben
      Abschnitt ein eigenes Feld. Ursache war, dass der Abschnitt in ZWEI Anfragen gefüllt
      wird und das Modell die Nachbarfelder nicht sah.
    abschnitt_nr: 6
    eingabe: >-
      Die Kastration ist durch eine tierärztliche Bescheinigung nachzuweisen, und die
      Chipnummer ist der Bewilligungsbehörde mitzuteilen.
    felder: [otherConditions]
    # Genau wie im Betrieb: diese drei werden in der anderen Anfrage gefüllt.
    nachbarn: [auditRights, purposeBindingYears, ancillary]
    erwartet:
      otherConditions:
        enthaelt: [chipnummer]
        nicht: [Landesrechnungshof, inventarisier, Geschlechtergleichstellung]
        gedeckt: true

  # ---------------------------------------------------------------------------
  # Bausteine 4, 7 und 8 — bis zum 23.09.2026 mit keinem einzigen Fall gemessen.
  #
  # Ausgewählt, weil dort Musterbausteine UND echte Prüfregeln sitzen: Geltungsdauer,
  # Antragsfrist, Auswahlverfahren. Ein falscher Wert hat hier Folgen im Verfahren, nicht
  # nur im Text.
  # ---------------------------------------------------------------------------

  - id: F-18-voraussetzungen-eigen
    notiz: >-
      Voraussetzungen sind der Kern von Baustein 4 — und genau das Feld, das sich im
      Durchlauf vom 22.09.2026 den Empfängerkreis und die Kosten aus anderen Bausteinen
      zusammensuchte. Es darf NUR Voraussetzungen enthalten.
    abschnitt_nr: 4
    eingabe: >-
      Der Antragsteller muss seinen Sitz im Land Brandenburg haben und die Maßnahme dort
      durchführen. Tierschutzvereine müssen nach § 11 des Tierschutzgesetzes erlaubt und
      amtlich anerkannt sein.
    felder: [requirements, area]
    erwartet:
      requirements: {enthaelt: [tierschutzgesetz], gedeckt: true}
      area: {enthaelt: [brandenburg]}

  - id: F-19-beihilfe-de-minimis
    notiz: >-
      Die beihilferechtliche Einordnung ist eine Mehrfachauswahl mit vier Optionen. Nennt
      die Angabe De-minimis ausdrücklich, muss genau das kommen — und nicht zusätzlich die
      AGVO, die das Modell gern mitnimmt.
    abschnitt_nr: 4
    eingabe: >-
      Die Förderung erfolgt als De-minimis-Beihilfe nach der einschlägigen
      De-minimis-Verordnung.
    felder: [aidRegime]
    erwartet:
      aidRegime: {enthaelt: [de-minimis], nicht: [notification], gedeckt: true}

  - id: F-20-verfahren-vollstaendig
    notiz: >-
      Der Regelfall von Baustein 7: Behörde, Verfahren, Frist, Auszahlung, Stufigkeit auf
      einmal. „Mit Antragsfrist" und das Datum hängen zusammen — kommt das eine ohne das
      andere, ist die Richtlinie in sich widersprüchlich.
    abschnitt_nr: 7
    eingabe: >-
      Bewilligungsbehörde ist das Landesamt für Ländliche Entwicklung, Landwirtschaft und
      Flurneuordnung. Anträge sind schriftlich bis zum 31. März 2027 zu stellen. Die
      Auszahlung erfolgt nach dem Erstattungsprinzip in einem zweistufigen Verfahren.
    felder: [authority, applicationProcedure, applicationDeadline, payment, applicationType]
    erwartet:
      authority: {enthaelt: [landesamt], gedeckt: true}
      applicationProcedure: {wert: analog-deadline}
      applicationDeadline: {enthaelt: ["2027-03-31"], gedeckt: true}
      payment: {wert: refund}
      applicationType: {wert: two}

  - id: F-21-windhund-ohne-kriterien
    notiz: >-
      Windhundprinzip heißt: es entscheidet der Zeitpunkt des Antrags, nicht eine Bewertung.
      Wertungskriterien wären dann ein Widerspruch — sie dürfen nicht miterfunden werden.
    abschnitt_nr: 7
    eingabe: >-
      Über die Anträge wird in der Reihenfolge ihres Eingangs entschieden, solange Mittel
      verfügbar sind.
    felder: [selection]
    erwartet:
      selection: {wert: first, gedeckt: true}

  - id: F-22-geltungsdauer
    notiz: >-
      Zwei Datumsangaben aus einem Satz. An ihnen hängen zwei Prüfregeln: die Reihenfolge
      (Fehler) und die Drei-Jahres-Grenze nach Anlage 19 zu VV Nr. 14.2.1 (Warnung,
      begründungspflichtig). Kommen die Daten nicht als Datum an, schlägt keine von beiden an.
    abschnitt_nr: 8
    eingabe: >-
      Die Richtlinie tritt am 1. Januar 2027 in Kraft und am 31. Dezember 2031 außer Kraft.
    felder: [validFrom, validUntil]
    erwartet:
      validFrom: {enthaelt: ["2027-01-01"], gedeckt: true}
      validUntil: {enthaelt: ["2031-12-31"], gedeckt: true}

  - id: F-23-geltungsdauer-nicht-genannt
    notiz: >-
      Die Eingabe schweigt zur Geltungsdauer. Ein geratenes Datum stünde in der Richtlinie
      als Festlegung, an der Zuwendungsempfänger ihre Planung ausrichten.
    abschnitt_nr: 8
    eingabe: Gefördert wird die Kastration freilebender Katzen aus Landesmitteln.
    felder: [validFrom, validUntil]
    erwartet:
      validFrom: {unklar: true}
      validUntil: {unklar: true}

  # ---------------------------------------------------------------------------
  # Teilweise ausgefüllte Abschnitte — der Normalfall.
  #
  # Die Bearbeiterin füllt selten einen Abschnitt am Stück. Bis zum 24.09.2026 sah das Modell
  # die schon bestätigten Felder nicht und riet jedes für sich: „Antragsverfahren: mit Frist"
  # stand im Entwurf, und die Antragsfrist kam trotzdem als [Unklar].
  #
  # `bestaetigt:` gibt vor, was schon entschieden ist. `regelfall: true` steht für den Knopf
  # „Vorschlag holen" im Formular, wo ein ungedecktes Feld aus dem Regelfall abgeleitet
  # werden darf — im Gespräch ist das verboten.
  # ---------------------------------------------------------------------------

  - id: F-24-frist-folgt-aus-verfahren
    notiz: >-
      „Schriftlich, mit Antragsfrist" ist bestätigt. Dann MUSS die Antragsfrist ein Datum
      bekommen — ein Verfahren mit Frist ohne Frist ist in sich widersprüchlich.
    abschnitt_nr: 7
    eingabe: Anträge sind bis zum 31. März 2027 einzureichen.
    bestaetigt:
      applicationProcedure: Schriftlich, mit Antragsfrist
    felder: [applicationDeadline]
    erwartet:
      applicationDeadline: {enthaelt: ["2027-03-31"], gedeckt: true}

  - id: F-25-festbetrag-statt-satz
    notiz: >-
      Festbetragsfinanzierung ist bestätigt. Dann gehört der Betrag gefüllt und der
      Fördersatz nicht — bei einem Festbetrag gibt es keinen Prozentsatz.
    abschnitt_nr: 5
    eingabe: Je Mitglied und Jahr werden 12 Euro gewährt.
    bestaetigt:
      financingType: Festbetragsfinanzierung
    felder: [fixedAmount, fundingRate]
    erwartet:
      fixedAmount: {wert: 12, gedeckt: true}
      fundingRate: {unklar: true}

  - id: F-26-regelfall-im-formular
    notiz: >-
      Der Knopf „Vorschlag holen" bei leerem Verlauf. Hier IST der Regelfall das Gewünschte —
      die Musterrichtlinie hat zu Baustein 7 zehn Musterbausteine. Ohne diesen Schalter kam
      ein Feld von sechs zurück.
    abschnitt_nr: 7
    regelfall: true
    eingabe: Gefördert wird die Kastration freilebender Katzen aus Landesmitteln.
    felder: [payment, applicationType]
    erwartet:
      payment: {unklar: false}
      applicationType: {unklar: false}

  - id: F-27-ohne-regelfall-schweigt-der-chat
    notiz: >-
      Dieselbe Eingabe, aber als Gespräch. Dort ist Schweigen eine Auskunft: die Bearbeiterin
      wurde gefragt und hat nichts gesagt. Ein abgeleiteter Wert wäre eine Unterstellung.
    abschnitt_nr: 7
    eingabe: Gefördert wird die Kastration freilebender Katzen aus Landesmitteln.
    felder: [payment, applicationType]
    erwartet:
      payment: {unklar: true}
      applicationType: {unklar: true}

  - id: F-28-bestaetigtes-nicht-widersprechen
    notiz: >-
      Der Empfängerkreis ist bestätigt. Die Konkretisierung darf ihn ausfüllen, aber ihm
      nicht widersprechen — ein Vorschlag, der eine menschliche Entscheidung überschreibt,
      ist der teuerste Fehler dieser Naht.
    abschnitt_nr: 3
    eingabe: Gefördert werden amtlich anerkannte Tierschutzvereine.
    bestaetigt:
      recipients: Juristische Personen des privaten Rechts
    felder: [recipientDetails]
    erwartet:
      recipientDetails: {enthaelt: [tierschutzverein], nicht: [kommun], gedeckt: true}
